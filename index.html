<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor - A História Secreta de Nós Dois 🕵️‍♀️</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive; /* Fonte estilo arcade/pixel */
            text-align: center;
            padding: 20px;
            background-color: #0d0d0d; /* Fundo bem escuro */
            color: #e0e0e0; /* Cor de texto mais clara para contraste */
            margin: 0;
        }
        h1, h2, h3 {
            font-family: 'Creepster', cursive; /* Fonte mais "assustadora" */
            color: #e2062c; /* Vermelho vibrante, como o logo de Stranger Things */
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.5); /* Sombra vermelha para o texto */
            margin-bottom: 15px;
        }
        p {
            font-family: Arial, sans-serif; /* Uma fonte mais legível para parágrafos */
            color: #ccc;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            border: 2px solid #e2062c; /* Borda vermelha */
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); /* Brilho vermelho */
            background-color: #1a1a1a; /* Fundo mais escuro para o conteúdo */
            border-radius: 8px;
        }
        .galeria-fotos {
            display: flex;
            justify-content: center;
            gap: 30px; /* Espaço maior entre as fotos */
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .foto-container {
            border: 3px solid #e2062c; /* Borda vermelha nas fotos */
            padding: 10px;
            border-radius: 10px;
            background-color: #2a2a2a; /* Fundo para cada foto */
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); /* Brilho vermelho suave */
            max-width: 320px;
            width: 100%;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .foto-container:hover {
            transform: translateY(-5px); /* Efeito de levantar no hover */
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6); /* Brilho mais intenso no hover */
        }
        .foto-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;
            filter: grayscale(20%); /* Pequeno efeito vintage/assustador */
        }
        .foto-container p {
            font-family: 'Press Start 2P', cursive;
            color: #fce8a6; /* Amarelo queimado/vintage */
            margin-top: 15px;
            font-size: 0.8em; /* Texto um pouco menor */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }
        hr {
            border: none;
            border-top: 2px dashed #e2062c;
            margin: 50px auto;
            width: 80%;
        }
        footer p {
            font-family: 'Press Start 2P', cursive;
            color: #e2062c;
            margin-top: 40px;
            font-size: 0.9em;
            text-shadow: 1px 1px 2px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bem-vindo ao Nosso Mundo Invertido 🌌</h1>
            <p>Nossos momentos e três fotos</p>
        </header>

        <hr>

        <div class="galeria-fotos">
            
            <div class="foto-container">
                <img src="foto1.jpg" alt="No shopping quando eu estava brava">
                <p>No shopping quando eu tava brava 😡</p>
            </div>

            <div class="foto-container">
                <img src="foto2.jpg" alt="Minutos antes de você ir embora">
                <p>Minutos antes de você ir embora 💔</p>
            </div>

            <div class="foto-container">
                <img src="foto3.jpg" alt="Malhando juntos pela primeira vez">
                <p>Malhando juntos pela prm vez 💪</p>
            </div>

        </div>

        <hr>

        <footer>
            <p>Que a nossa aventura nunca termine! Te amo 🧡</p>
        </footer>
    </div>

</body>
</html>
